image:
  file: .gitpod.Dockerfile

tasks:
  - name: Set up Python environment
    init: pip install -r requirements.txt
     command: python3 manage.py runserver 0.0.0.0:8000

ports:
 - port: 8000
    onOpen: open-preview

vscode:
  extensions:
    - ms-python.python
    - ms-toolsai.jupyter
    - ms-toolsai.jupyter-keymap
    - ms-toolsai.jupyter-renderers
